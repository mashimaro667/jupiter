<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주피터</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="주피터">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b1026">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<script src="web.js?v=2.3.0"></script>
<style>
/* 화면 모드: html 의 data-theme (light/dark) 로 바꾼다. 자동이면 휴대폰 설정을 따른다 (applyTheme) */
:root{--bg:#f4f5f8;--card:#fff;--text:#1d2230;--sub:#6b7280;--line:#e5e7eb;--accent:#3b4a8c;--link:#3b4a8c;--accent2:#c08a2e;--ok:#1f8a4c;--tr:#3b4a8c;--vu:#b2721f;--rc:#2a8a74;--call:#2e9d5b;--miss:#c4483b;color-scheme:light}
:root[data-theme=dark]{--bg:#111318;--card:#1c1f27;--text:#eceef4;--sub:#9aa1ae;--line:#2d313c;--accent:#5466c4;--link:#9eacff;--accent2:#e6b05a;--ok:#4cc382;--tr:#6f82e6;--vu:#d79a3e;--rc:#45b89b;--call:#2b8a52;--miss:#b8473c;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;font-size:17px}
/* 머리글 (1.9.0): 로고와 같은 남색 바탕 + 금색 글씨, 제목은 가운데. 밝게·어둡게 모두 같은 색 */
header{position:sticky;top:0;z-index:5;background:linear-gradient(115deg,#0b1026 0%,#18214a 55%,#262338 100%);border-bottom:2px solid #c9a24a;box-shadow:0 2px 10px rgba(11,16,38,.25);display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:10px 12px;min-height:60px}
header h1{font-size:20px;margin:0;text-align:center;color:#f1d892;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
.back{border:0;background:none;color:#f1d892;font-size:30px;padding:0 6px 0 0;line-height:1;text-align:left}
header .back.hidden{display:block;visibility:hidden}
.brand{display:inline-flex;align-items:center;gap:10px;vertical-align:middle}
.brand img{width:38px;height:38px;border-radius:10px;box-shadow:0 0 0 1px rgba(241,216,146,.55),0 2px 8px rgba(0,0,0,.45)}
.brand b{display:block;text-align:left;font-family:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;font-size:23px;font-weight:800;line-height:1.05;background:linear-gradient(180deg,#fff3c8 0%,#e7c06a 55%,#c08a2e 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;text-align:left;font-size:10px;letter-spacing:4.5px;color:#c9a24a;margin-top:3px;font-weight:600}
main{padding:16px;max-width:760px;margin:0 auto}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kind{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 16px;text-align:left;color:var(--text);font-size:20px;font-weight:700}
.kind small{display:block;font-size:15px;font-weight:400;color:var(--sub);margin-top:8px}
.kind.tr{border-top:5px solid var(--tr)} .kind.vu{border-top:5px solid var(--vu)} .kind.rc{border-top:5px solid var(--rc)}
.kinds.three{grid-template-columns:1fr 1fr 1fr;gap:8px} .kinds.three .kind{padding:20px 6px;font-size:18px}   /* 2.0.1 고객관리: 이관고객 · 밸류업 · 리쿠르팅 */
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:14px;font-size:16px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;font-size:18px;padding:16px}
.btn.primary.call{background:var(--call);border-color:var(--call)}
/* 첫 화면 단추 줄 (1.10.0): 고객 직접 추가 2 : 명단 불러오기 2 : 양식 1 / 아래 줄 문자 문구 · 연락처 양식 반반 */
.homebar{display:grid;grid-template-columns:2fr 2fr 1fr;gap:8px;margin-top:14px}
/* 내 이름·직책 (1.11.0): 잠긴 칸 + [수정]/[저장] */
.mefield{display:grid;grid-template-columns:1.3fr 54px 1fr 54px;gap:6px;align-items:center}   /* 1.12.0: 이름 [수정] 직책 [수정] 가로 한 줄 */
.kinds.home .kind{text-align:center}   /* 1.12.0: 첫 화면 이관고객·밸류업 가운데 */
.mefield .search{margin:0;padding:10px 10px;min-width:0}
.mefield .search:disabled{background:transparent;border-style:dashed;color:var(--text);opacity:1;-webkit-text-fill-color:var(--text)}
.mefield .btn{min-width:0;padding:10px 2px;font-size:14px}
.mefield .search::placeholder{color:var(--sub);-webkit-text-fill-color:var(--sub);opacity:.8}
/* 설정 (1.11.0) */
.setbtn{display:block;width:100%;margin-top:10px;font-weight:700}
.setbtn small{font-weight:400;color:var(--sub);font-size:13px;margin-left:6px}
.setrow{display:grid;grid-template-columns:1fr auto;width:100%;text-align:left;margin-top:10px;font-weight:700;align-items:center}
.setrow small{grid-column:1;display:block;font-weight:400;color:var(--sub);font-size:13px;margin-top:4px}
.setrow i{grid-column:2;grid-row:1 / span 2;font-style:normal;font-size:24px;color:var(--sub)}
.homebar .btn{min-width:0;padding:14px 4px;font-size:clamp(13px,4.3vw,16px);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.homebar .btn.primary{font-size:clamp(13px,4.3vw,16px);padding:14px 4px}
.homebar .formdl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 2px;font-size:13px;color:var(--link)}
.homebar .formdl b{font-size:18px;line-height:1}
.theme{display:flex;align-items:center;gap:8px;margin-top:18px}
.theme span{color:var(--sub);font-size:14px;white-space:nowrap}
.theme .btn{min-width:0;padding:10px 6px;font-size:15px}
.note{color:var(--sub);font-size:14px;margin-top:12px;line-height:1.5}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:16px;margin-bottom:10px}
ul.names{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
ul.names li{display:flex;align-items:center;gap:10px;padding:15px 16px;border-top:1px solid var(--line)}
ul.names li:first-child{border-top:0}
ul.names li{transition:background .6s}
ul.names li.flash{background:color-mix(in srgb, var(--accent) 18%, var(--card))}
ul.names li .nm{font-size:18px;flex:1}
ul.names li .nm .info{font-size:15px;color:var(--sub)}
ul.names li .nm .sub{display:block;font-size:13px;color:var(--sub);margin-top:3px}
ul.names li.sec{background:var(--bg);padding:9px 16px;font-weight:700}
ul.names li.sec .nm{font-size:15px;color:var(--vu)}
ul.names li.sec .secbtn{font:inherit;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text)}
ul.names li .tail{color:var(--sub);font-size:14px}
ul.names li .sent{color:var(--ok);font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 6px;font-size:22px}
.meta{color:var(--sub);font-size:15px}
.preview{white-space:pre-wrap;line-height:1.6;font-size:16px}
.tag{display:inline-block;font-size:13px;padding:2px 8px;border-radius:999px;color:#fff;margin-left:6px;vertical-align:middle}
.tag.tr{background:var(--tr)} .tag.vu{background:var(--vu)} .tag.rc{background:var(--rc)}
label{display:block;font-weight:700;margin:14px 0 6px}
label.off{opacity:.4}
.search:disabled{opacity:.45;background:var(--bg)}
.btn.seg.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
textarea{width:100%;min-height:200px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:16px;line-height:1.5}
.count{color:var(--sub);font-size:13px;text-align:right;margin-top:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222a;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;display:none;max-width:90%;text-align:center;backdrop-filter:blur(6px)}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal .box{background:var(--card);border-radius:16px;padding:18px;max-width:420px;width:100%}
.modal .box .mtext{margin:0 0 14px;line-height:1.6}
.modal .box .mtext .search{margin:8px 0 0}
.modal .box .mtext textarea{min-height:110px;margin-top:8px}
.hidden{display:none}
/* 기록: 부재중 · 통화완료 · 약속 (1.2.0) */
.rec3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.rec3 .btn{min-width:0;padding:14px 4px;font-weight:700;color:#fff}
.rec3.four{grid-template-columns:repeat(4,1fr)}   /* 2.0.3 리쿠르팅: 부재중 · 통화완료 · CIS · TS */
.btn.ts{background:var(--rc);border-color:var(--rc)}
.btn.miss{background:var(--miss);border-color:var(--miss)} .btn.done{background:var(--call);border-color:var(--call)} .btn.appt{background:var(--accent2);border-color:var(--accent2)}
.remind{margin-top:10px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb, var(--miss) 12%, var(--card));display:flex;align-items:center;gap:8px;font-size:15px}
.remind span{flex:1}
.remind button,.hist button{border:1px solid var(--line);background:var(--card);color:var(--link);border-radius:8px;padding:6px 10px;font-size:14px}
ul.hist{list-style:none;margin:10px 0 0;padding:0}
ul.hist li{border-top:1px solid var(--line);padding:10px 0;font-size:15px;line-height:1.5}
ul.hist li .when{color:var(--sub);font-size:13px;margin-right:6px}
ul.hist li .memo{display:block;color:var(--sub);font-size:14px;white-space:pre-wrap}
ul.hist li .acts{display:flex;gap:6px;margin-top:6px}
ul.hist li .acts .x{margin-left:auto;color:var(--sub)}
ul.names li .st{font-size:15px}
/* 문자 문구: 고칠 수 없는 이름 자리 + 호칭 (1.3.0) */
.namebar{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.namebar .lockname{flex:1;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;color:var(--sub);font-weight:700;font-size:15px}
.namebar .btn{flex:0 0 auto;min-width:0;padding:12px 14px}
.tbox{margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:grid;grid-template-columns:1fr 1fr;margin-top:16px;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:none;color:var(--sub);font-size:17px;font-weight:700;padding:12px 0;margin-bottom:-2px;border-bottom:3px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--link);border-radius:999px;padding:6px 12px;font-size:14px}
/* 연락처 이름 양식: 일곱 칸 가로 나열 (1.5.2, 1.15.0부터 일곱 칸). 화면이 좁으면 옆으로 밀어 봄 */
.cfstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cfslot{display:flex;flex-direction:column;gap:5px;min-width:0}
.cfslot span{text-align:center;color:var(--sub);font-size:14px}
.cfslot button{min-height:54px;padding:6px 2px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:13px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.cfslot button.off{color:var(--sub);border-style:dashed}
.cfslot button.grade{min-height:40px;background:color-mix(in srgb, var(--accent) 14%, var(--card));font-weight:700;font-size:16px}
/* 첫 화면 (2.0.0): 연락처 저장 / 고객관리 두 카드 */
.startcards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}   /* 가로 한 줄, 설명 없음 (지시) */
.startcards .kind{text-align:center;padding:22px 8px;font-size:20px}
.startcards .kind b{display:block;font-size:20px;font-weight:400;margin-bottom:6px}
.kind.cs{border-top:5px solid var(--accent2)} .kind.cm{border-top:5px solid var(--tr)}
/* 광고DB (2.1.0): 첫 화면 세 카드 · 보장분석 / 리쿠르팅 */
/* 2.2.0: 한 줄에 두 개까지 — 고객관리 · 광고DB / 연락처 저장 (지시) */
.kind.ad{border-top:5px solid var(--miss)} .kind.ba{border-top:5px solid var(--vu)}
.tag.ad{background:var(--miss)}
/* 연락처 저장 (2.0.0, 헤라 합침): 미리보기 · 이모지 고르기 칸 · 등급 A~E · 이모지 목록 창 */
.in{margin:0;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prev{position:sticky;top:62px;z-index:4;background:color-mix(in srgb, var(--accent) 10%, var(--card));border:1px solid color-mix(in srgb, var(--accent) 35%, var(--line));border-radius:14px;padding:12px 16px;margin-bottom:12px}
.prev .meta{font-size:13px}
.prev .nm{font-size:20px;font-weight:800;margin-top:4px;word-break:break-all}
.prev .ph{font-size:15px;color:var(--sub);margin-top:2px}
.pick{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:17px;text-align:left}
.pick span{flex:1;text-align:left} .pick span.em{flex:0 0 auto;font-size:28px;line-height:1;min-width:32px;text-align:center}
.pick i{font-style:normal;color:var(--sub)}
.grades{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.grades button{padding:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:17px;font-weight:700}
.grades button.none{font-size:14px;font-weight:400;color:var(--sub)}
.grades button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cschips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.cschips button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 12px;font-size:15px}
.cschips button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.cslink{display:flex;gap:6px}
.cslink button{border:1px solid var(--line);background:var(--card);color:var(--link);border-radius:8px;padding:6px 10px;font-size:14px}
.emolist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:60vh;overflow:auto}
.emolist button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:13px}
.emolist button b{font-size:28px;font-weight:400;line-height:1.1}
.emolist button.on{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 14%, var(--card));font-weight:700}
.emolist .sec{grid-column:1/-1;color:var(--sub);font-size:13px;margin-top:4px}
</style>
</head>
<body>
<header><button class="back hidden" id="back" onclick="goBack()">‹</button><h1 id="title">주피터</h1><span></span></header>
<main id="view"></main>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box"><div class="mtext" id="mText"></div><div class="row" id="mBtns"></div></div></div>

<script>
// ---------- 저장 (휴대폰 안 앱 데이터) ----------
const KINDS = {tr:'이관고객', vu:'밸류업', rc:'리쿠르팅'};
// 리쿠르팅 (2.0.1, 2026-10-13 지시): 분류 = 리쿠 / DB / 상생 / 잡사 / 직접 입력. 연락처 이름 끝에는 '이관·밸류업' 대신 이 분류가 붙는다
const RC_GROUPS = ['리쿠','DB','상생','잡사'];
// 이관 분류 (2.0.7, 2026-10-14 지시): 직접 추가에서 본사관심 / 해촉FC 중 고르기 (PC 앱 명단도 같은 이름)
const TR_GROUPS = ['본사관심','해촉FC'];
const chipGroups = k => k==='rc' ? RC_GROUPS : k==='tr' ? TR_GROUPS : null;
// 문자 문구 (1.4.0, 2026-10-11 지시): 문자 = 고객 이름 + 호칭(님/고객님), 머리말 / 본문 / 마무리
// - 이름 자리는 고칠 수 없다 (1.3.0: {이름}을 문구 안에 두면 지워지거나 바뀔 수 있어서)
// - 문구는 이관고객 / 밸류업(기본 + 분류별: 쇼핑엔티 등)으로 따로 둔다 (1.6.0: 약속 문자는 약속 화면에서 고객마다 고침). 따로 정하지 않은 밸류업 분류는 밸류업 기본 문구를 쓴다
// - 저장: letters = {v:3, tpl:{tr, vu, appt, 'vu:쇼핑엔티', ...}}, 문구 하나 = {hon, head, body, tail}
const HONS = ['님','고객님'];
// 밸류업 분류 (1.14.0, 2026-10-11): 명단 엑셀 '분류' 칸의 이름 그대로. 고정 목록 없이 명단에 있는 이름·문구를 써 둔 이름으로 칸이 생긴다
// 1.13.0의 그룹 번호(성격 그룹1~10 + 오른쪽 이름표)는 되돌림 — 남은 그룹 번호 문구·고객은 undoGroups()가 이름으로 바꾸고,
// 1.13.0 모양 엑셀을 불러와도 그룹 번호 대신 이름표의 이름(없으면 '그룹N')을 분류로 쓴다
let groupNames = load('groups', {});   // 1.13.0 이름표 (되돌릴 때만 씀)
const GROUP_MAX = 10;
const DEFAULT_TPL = {
  tr:  {hon:'님', head:'안녕하세요.', body:'(이관고객님께 드릴 내용을 [문자 문구]에서 적어 주세요)', tail:'', appt:'{날짜} {시간}에 {장소}에서 뵙겠습니다.'},
  vu:  {hon:'님', head:'안녕하세요.', body:'(밸류업 고객님께 드릴 내용을 [문자 문구]에서 적어 주세요)', tail:'', appt:'{날짜} {시간}에 {장소}에서 뵙겠습니다.'},
  rc:  {hon:'님', head:'안녕하세요.', body:'(리쿠르팅 대상께 드릴 내용을 [문자 문구]에서 적어 주세요)', tail:'', appt:'{날짜} {시간}에 {면접관}과 면접이 있습니다.'},
  appt:{hon:'님', head:'안녕하세요.', body:'{날짜} {시간}에 {장소}에서 뵙겠습니다.', tail:'감사합니다.'},

function upgradeLetters(l){
  if(l.v===3 && l.tpl) return l;
  const tpl = {};
  for(const k of ['tr','vu','appt']){
    if(typeof l[k] !== 'string') continue;
    let s = l[k], hon = (l.hon||{})[k] || '님';
    if(l.v!==2){ const m = s.match(/^\s*\{(?:이름|고객명)\}\s*(고객님|님)?/); if(m){ s = s.slice(m[0].length); hon = m[1] || '님'; } }
    s = s.replace(/^[\s,]+/, '');
    const nl = s.indexOf('\n');
    tpl[k] = {hon, head:(nl<0 ? s : s.slice(0,nl)).trim(), body:nl<0 ? '' : s.slice(nl+1), tail:''};
  }
  return {v:3, tpl};
}

// 따옴표·줄바꿈이 든 칸도 읽는 CSV 나누기
function parseCsv(t){
  const out = []; let row = [], f = '', q = false;
  t = String(t).replace(/^﻿/, '');
  for(let i=0; i<t.length; i++){
    const ch = t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q = false; } else f += ch; continue; }
    if(ch==='"') q = true; else if(ch===','){ row.push(f); f=''; }
    else if(ch==='\n' || ch==='\r'){ if(ch==='\r' && t[i+1]==='\n') i++; row.push(f); out.push(row); row=[]; f=''; }
    else f += ch;
  }
  if(f || row.length){ row.push(f); out.push(row); }
  return out.filter(r=>r.some(v=>String(v).trim()));
}

// ---------- 연락처 저장 (2.0.0, 헤라 1.1.0을 합침) ----------
// 연락처 이름 = 이모지 + 등급(A~E) / 이름 / 생년 / 지역 / 기타 — 이모지·등급은 붙이고 나머지는 '/' (빈 칸 건너뜀). 예: 🏢D/김주성/88/논현동/밸류업
// 이모지는 연락처 정리본(996명, 2026-10-13)에서 쓰는 것을 많이 쓰는 순서로 + 몇 개 더. 칸을 누르면 목록 창
// [연락처 저장]은 연락처 앱의 새 연락처 화면을 채워 연다 (Android.openContact, 웹판은 .vcf). 저장한 뒤 이모지·등급은 남김
// 저장: csSaved(최근 저장 200) · csOrder(이름 칸 순서)
const CS_EMO_MINE = [['🪖','군대'],['🏫','학교·선생님'],['🏢','회사·고객'],['🍀','친구'],['📌','기타·업체'],['🏠','가족'],['🏆','레저·운동'],['🧸','아이들'],['💖','S']];
const CS_EMO_MORE = [['⭐','중요'],['🤝','소개'],['💼','거래처'],['🏥','병원'],['⛪','교회'],['🎶','음악']];
const CS_GRADES = ['A','B','C','D','E'];
const CS_PARTS = {name:'이름', year:'생년', region:'지역', extra:'기타'};
const CS_DEF_ORDER = ['name','year','region','extra'];
const csEmoLabel = e => ([...CS_EMO_MINE, ...CS_EMO_MORE].find(([x])=>x===e) || [e, '직접 넣은 이모지'])[1];
let csOrder = (()=>{ const o = load('csOrder', null); return Array.isArray(o) && o.length===CS_DEF_ORDER.length && CS_DEF_ORDER.every(k=>o.includes(k)) ? o : [...CS_DEF_ORDER]; })();
let csSaved = load('csSaved', []);
function csBlank(keep){ return {emoji: keep ? keep.emoji : '🏢', grade: keep ? keep.grade : 'D', name:'', year:'', region:'', extra:'', phone:'', memo:''}; }
// 적던 내용(csF)은 저장하지 않는다 — 뒤로 가거나(start()에서 비움) 앱을 끄면 지워짐 (2.0.0, 2026-10-13 지시)
let csF = csBlank();
try{ localStorage.removeItem('csDraft'); }catch(e){}
function csYY(y){ y = String(y||'').replace(/\D/g,''); return y.length>=4 ? y.slice(2,4) : y.slice(0,2); }
function csName(x){
  const em = String(x.emoji||'').trim(), g = CS_GRADES.includes(x.grade) ? x.grade : '';
  const p = csOrder.map(k => k==='year' ? csYY(x.year) : String(x[k]||'').trim()).filter(Boolean);
  return em + g + (g && p.length ? '/' : '') + p.join('/');
}
function csPhone(p){ p = String(p||'').replace(/\D/g,''); if(p.startsWith('82') && p.length>=11) p = '0' + p.slice(2);
  return p.length===11 ? p.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3') : p.length===10 ? (p.startsWith('02') ? p.replace(/(\d{2})(\d{4})(\d{4})/,'$1-$2-$3') : p.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3'))
       : p.length===9 && p.startsWith('02') ? p.replace(/(\d{2})(\d{3})(\d{4})/,'$1-$2-$3') : p; }
function csHome(){

      ${field('extra','예: 이관, 밸류업, 회사명')}
      <label>전화번호</label>
      ${field('phone','010-1234-5678','tel','tel')}

      <div class="row">

    </div>

    ${csSaved.length ? `<ul class="names">${csSaved.slice(0,30).map((s,i)=>`<li><span class="nm">${esc(csName(s))}<span class="sub">${esc(csPhone(s.phone))} · ${esc(s.at)}</span></span>
      <span class="tail cslink"><button onclick="csRefill(${i})">다시</button><button onclick="csDel(${i})">✕</button></span></li>`).join('')}</ul>` : `<div class="empty">아직 저장한 연락처가 없습니다</div>`}`;

function csSet(k, v){

function csSave(){
  if(!String(csF.name||'').trim()){ toast('이름을 적어 주세요'); document.getElementById('cs_name').focus(); return; }
  if(csF.phone && csF.phone.replace(/\D/g,'').length<9){ toast('전화번호를 확인해 주세요'); return; }
  const name = csName(csF), phone = csPhone(csF.phone);
  const ok = window.Android ? Android.openContact(name, phone, csF.memo||'') : (toast(name + ' · ' + phone), true);
  if(!ok){ toast('연락처 앱을 열지 못했습니다'); return; }
  const d = new Date(), z = n=>String(n).padStart(2,'0');
  csSaved = [{...csF, phone, at:`${d.getMonth()+1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}`}, ...csSaved].slice(0, 200); save('csSaved', csSaved);

}
function csRefill(i){ csF = {...csBlank(), ...csSaved[i]}; delete csF.at; csDraw(); window.scrollTo(0,0); toast('다시 채웠습니다. 고친 뒤 [연락처 저장]'); }

// 평소에는 잠겨 있고 [수정]을 눌러야 고칠 수 있다 → [저장]을 누르면 다시 잠긴다 (쉽게 바뀌지 않게)
// 문자 문구에서 {내이름} {직책} 자리에 들어간다
let me = load('me', {name:'', title:''});
function meField(k, ph){   // 1.12.0: 칸 이름 없이 흐린 안내 글(내 이름 / 내 직책)만
  return `<input class="search" id="me_${k}" value="${esc(me[k])}" placeholder="${ph}" aria-label="${ph}" disabled onkeydown="if(event.key==='Enter')meEdit('${k}')">
    <button class="btn" id="meb_${k}" onclick="meEdit('${k}')">수정</button>`;
}
// 1.14.1: [수정]을 누르고 고치다가 [저장] 없이 다른 화면으로 가거나 앱을 닫아도 지워지지 않게 그대로 저장한다 (엔터도 저장)
function meFlush(){ ['name','title'].forEach(k=>{ const i = document.getElementById('me_'+k); if(i && !i.disabled) meEdit(k); }); }
window.addEventListener('pagehide', meFlush);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') meFlush(); });
function meEdit(k){
  const inp = document.getElementById('me_'+k), b = document.getElementById('meb_'+k);
  if(inp.disabled){ inp.disabled = false; inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); b.textContent = '저장'; b.classList.add('primary'); return; }
  me[k] = inp.value.trim(); save('me', me);
  inp.value = me[k]; inp.disabled = true; b.textContent = '수정'; b.classList.remove('primary');
  toast((k==='name' ? '내 이름' : '내 직책') + '을 저장했습니다');
}

    <button class="btn setrow" onclick="show(()=>contactFmtForm(null))">연락처 양식 <small>${contactFmt.mode==='manual'?'수동':'자동'} — 연락처에 저장할 이름 모양</small><i>›</i></button>
    <label style="margin-top:22px">화면 스타일</label>
    <div class="theme" style="margin-top:0">
      ${[['light','밝게'],['dark','어둡게']].map(([k,t])=>`<button class="btn seg${themeMode===k?' on':''}" onclick="setTheme('${k}')">${t}</button>`).join('')}</div>
    <p class="note">${themeMode==='auto' ? '지금은 휴대폰 설정(다크 모드)을 따릅니다. 밝게·어둡게를 고르면 그 화면으로 고정됩니다.' : '휴대폰 설정과 상관없이 이 화면으로 보입니다.'}</p>
    ${window.webExtra ? webExtra('settings') : ''}`;   // 웹판: 캘린더 알림 안내 · 판 번호 (web.js)
}

// ---------- 화면 모드: 기본은 자동(휴대폰 설정), 설정에서 밝게 / 어둡게로 고정 ----------
let themeMode = load('theme', 'auto');
function applyTheme(){
  const sysDark = window.Android && Android.isNightMode ? Android.isNightMode() : matchMedia('(prefers-color-scheme: dark)').matches;
  const dark = themeMode==='dark' || (themeMode==='auto' && sysDark);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  if(window.Android && Android.setDark) Android.setDark(dark);   // 위 상태 표시줄·아래 버튼 줄 색도 맞춘다
}
function setTheme(k){ themeMode = k; save('theme', k); applyTheme(); show(stack[stack.length-1] || home, false); }
applyTheme();

// ---------- 월 · 분류 ----------
// 월: '2026-09' (이관 = 캠페인 대상월, 밸류업 = FC배분월). 올해는 '9월', 다른 해는 '2025년 9월'. 최근 달이 위로
// 분류: 밸류업 캠페인 이름(쇼핑엔티·더열심히·한신지점·보닥·포인트파크 등). 예전 명단처럼 분류 칸에 월이 들어 있으면 월로 본다
const YM = /^\d{4}-\d{1,2}$/;
function monthOf(c){ return c.month || (YM.test(c.group||'') ? c.group : ''); }
function groupOf(c){ if(c.gno) return groupNames[c.gno] || '그룹'+c.gno; return YM.test(c.group||'') ? '' : (c.group||''); }
function monthLabel(m){ const x=String(m||'').match(/^(\d{4})-(\d{1,2})$/); if(!x) return '월 모름'; return (+x[1]===new Date().getFullYear()?'':x[1]+'년 ')+(+x[2])+'월'; }
function monthKey(m){ const x=String(m||'').match(/^(\d{4})-(\d{1,2})$/); return x ? x[1]+x[2].padStart(2,'0') : '0'; }
function normMonth(s){ s=String(s||'').trim(); const x=s.match(/(20\d{2})\D{0,3}(\d{1,2})/); return x && +x[2]>=1 && +x[2]<=12 ? x[1]+'-'+x[2].padStart(2,'0') : ''; }

// ---------- 고객 한 줄 정보: 85년생 / 불로동 ----------
// 지역은 가장 구체적인 한 단계만: 동(읍·면·가) → 구 → 시(군) → 시도. 엑셀에 주소 전체를 적어도 여기서 줄인다
const SIDO = /^(서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주|충청북|충청남|전라북|전라남|경상북|경상남)/;
function shortRegion(a){
  a = String(a||'').replace(/\[[^\]]*\]/g,' ').replace(/\(\d{5}\)/g,' ');
  if(!a.trim()) return '';
  const m = a.match(/\(\s*([가-힣]+\d*(?:동|읍|면|\d가))\s*[,)]/); if(m) return m[1];
  const tok = a.split(/[\s,()\/]+/).filter(Boolean);
  // 띄어쓰기 없이 붙은 주소 (서울특별시광진구자양동): 시·군·구·도 뒤의 동 → 구 → 시
  for(const [re,min] of [[/(?:시|군|구|도)([가-힣]{1,4}\d*(?:동|읍|면)|[가-힣]{1,3}\d가)$/,6],[/(?:시|도)([가-힣]{1,4}구)$/,5],[/도([가-힣]{1,4}(?:시|군))$/,5]])
    for(const t of tok){ const x = t.length>=min && t.match(re); if(x) return x[1]; }
  return tok.find(t=>(t.length<=5 && /^[가-힣]+\d*(동|읍|면)$/.test(t)) || /^[가-힣]+\d가$/.test(t))
      || tok.find(t=>/^[가-힣]{1,4}구$/.test(t))
      || tok.find(t=>/^[가-힣]+(시|군)$/.test(t) && !/(특별|광역|자치)시$/.test(t))
      || (tok.find(t=>SIDO.test(t))||'').replace(/^(충청|전라|경상)(북|남).*/,(x,a,b)=>({충청:'충',전라:'전',경상:'경'})[a]+b).slice(0,2);
}
function birthYear(v){ const s=String(v||'').trim(); let m=s.match(/^((?:19|20)\d{2})/); if(m) return m[1];
  m=s.match(/^(\d{2})\d{4}-([1-8])/); if(m) return ('1256'.includes(m[2])?'19':'20')+m[1];
  m=s.match(/^(\d{2})(년생)?$/); if(m) return (+m[1]>30?'19':'20')+m[1]; return ''; }
function info(c){ return [c.year?String(c.year).slice(2)+'년생':'', c.region||''].filter(Boolean).join(' / '); }

// ---------- 고객 목록: 월 → (밸류업은 분류별로 묶어서) 이름 ----------
const matchQ = (c,q) => !q || c.name.includes(q) || (c.region||'').includes(q);
const byName = (a,b) => a.name.localeCompare(b.name,'ko');
function list(kind){
  curRoute = ['list', kind];
  setTitle(KINDS[kind]);
  const all = customers.filter(c=>c.kind===kind);
  if(!all.some(monthOf)){ month(kind, null); return; }   // 월이 없는 명단은 바로 이름 목록
  window._months = [...new Set(all.map(monthOf))].sort((a,b)=>monthKey(b).localeCompare(monthKey(a)));
  $v().innerHTML = `<input class="search" id="q" placeholder="이름·지역 찾기 (전체)" oninput="drawMonths('${kind}')">
    <ul class="names" id="names"></ul>
    <p class="note">${all.length}명 · ${kind==='tr'?'대상월':'유입된 월'}별로 나눴습니다.</p>`;
  drawMonths(kind);
}
function drawMonths(kind){
  const q = (document.getElementById('q')?.value || '').trim();
  const all = customers.map((c,i)=>({...c,i})).filter(c=>c.kind===kind);
  if(q){ document.getElementById('names').innerHTML = rowsHtml(all.filter(c=>matchQ(c,q)).sort(byName)); return; }   // 찾을 때는 월과 상관없이
  document.getElementById('names').innerHTML = window._months.map((m,mi)=>{
    const cs = all.filter(c=>monthOf(c)===m), sent = cs.filter(c=>c.sent).length;
    // 그 달의 분류를 한 줄로 미리 보여 준다: 쇼핑엔티 40 · 한신지점 5 (2.0.6: 이관도 분류가 있으면 본사관심 12 · 해촉FC 3)
    const gs = kind!=='tr' || cs.some(groupOf) ? groupCounts(cs).map(([g,n])=>`${g} ${n}`).join(' · ') : '';
    return `<li onclick="openMonth('${kind}', ${mi})"><span class="nm">${esc(monthLabel(m))}${gs?`<span class="sub">${esc(gs)}</span>`:''}</span>
      ${sent?`<span class="sent">✓ ${sent}</span>`:''}<span class="tail">${cs.length}명</span></li>`;
  }).join('');
}
function groupCounts(cs){
  const m = new Map(); cs.forEach(c=>{ const g=groupOf(c)||'분류 없음'; m.set(g,(m.get(g)||0)+1); });
  return [...m].sort((a,b)=>(a[0]==='분류 없음')-(b[0]==='분류 없음') || b[1]-a[1] || a[0].localeCompare(b[0],'ko'));
}
function openMonth(kind, mi){ const m = window._months[mi]; show(()=>month(kind, m)); }
function month(kind, m){
  curRoute = ['month', kind, m];
  setTitle(m==null ? KINDS[kind] : `${KINDS[kind]} ${monthLabel(m)}`);
  const n = customers.filter(c=>c.kind===kind && (m==null || monthOf(c)===m)).length;
  $v().innerHTML = `<input class="search" id="q" placeholder="이름·지역 찾기" oninput="drawMonth('${kind}', window._curMonth)">
    <ul class="names" id="names"></ul>
    <p class="note">${n}명 · 보낸 고객은 날짜가 표시됩니다.</p>
    <button class="btn" style="width:100%" onclick="show(()=>addForm('${kind}', window._curMonth))">이 목록에 고객 추가</button>`;
  window._curMonth = m;
  drawMonth(kind, m);
}
function drawMonth(kind, m){
  const q = (document.getElementById('q')?.value || '').trim();
  const rows = customers.map((c,i)=>({...c,i})).filter(c=>c.kind===kind && (m==null || monthOf(c)===m) && matchQ(c,q));
  // 밸류업은 분류(캠페인)별 제목 아래에 이름을 모아 보여 준다
  // 2.0.8: 분류 제목 옆 [📇 모두 저장] — 그 분류 고객을 휴대폰 연락처에 한꺼번에 (앱만, 검색 중에는 숨김)
  const bulk = !q && window.Android && Android.saveContacts;
  window._secs = [];
  const secBtn = (g, cs) => { if(!bulk) return ''; window._secs.push(cs.map(c=>c.i));
    return `<button class="secbtn" onclick="event.stopPropagation();bulkContacts(${window._secs.length-1}, ${esc(JSON.stringify(g))})">📇 모두 저장</button>`; };
  if(rows.some(groupOf)){   // 2.0.1: 리쿠르팅도 분류(리쿠·DB·상생·잡사…)별로, 2.0.6: 이관도 본사관심·해촉FC별로
    document.getElementById('names').innerHTML = rows.length ? groupCounts(rows).map(([g,n])=>{
      const cs = rows.filter(c=>(groupOf(c)||'분류 없음')===g).sort(byName);
      return `<li class="sec"><span class="nm">${esc(g)}</span>${secBtn(g, cs)}<span class="tail">${n}명</span></li>` + rowsHtml(cs); }).join('') : rowsHtml([]);
  } else document.getElementById('names').innerHTML = (rows.length && bulk ? `<li class="sec"><span class="nm">전체</span>${secBtn(m==null ? KINDS[kind] : monthLabel(m), rows)}<span class="tail">${rows.length}명</span></li>` : '') + rowsHtml(rows.sort(byName));
}
// ---------- 연락처 한꺼번에 저장 (2.0.8, 2026-10-14 지시: "A로 해주고 분류별로 저장되게 해줘") ----------
// 같은 번호가 휴대폰 연락처에 이미 있으면 건너뛰고(손대지 않음), 끝나면 이미 있던 사람을 '고객 이름 → 연락처 이름'으로 보여 준다.
// 저장했거나 이미 있던 고객은 csaved(날짜)를 남겨 다음 [모두 저장]에서 빼고, 목록에 📇 표시. 연락처는 지우지 않는다.
function bulkContacts(si, g){
  const all = window._secs[si] || [], todo = all.filter(i=>!customers[i].csaved);
  if(!todo.length){ toast('모두 연락처에 저장한 고객입니다'); return; }
  const done = all.length - todo.length, web = !!window.webExtra;   // 웹판(아이폰)은 연락처 파일 하나로 묶어 연다 (웹판 2.0.8)
  window._bulkTodo = todo;
  ask(`${g} ${todo.length}명을 휴대폰 연락처에 저장할까요?` + (done?`\n(이미 저장한 ${done}명은 뺍니다)`:'') +
    (web ? '\n연락처 파일을 엽니다. 연락처 화면에서 [모든 연락처 추가]를 누르세요.' : '\n같은 번호가 연락처에 이미 있으면 건너뜁니다.'),
    [['저장', ()=>{ toast('연락처에 저장하는 중…');
      Android.saveContacts(JSON.stringify(todo.map(i=>{ const c = customers[i]; return {i, name: contactName(c), phone: fmtPhone(c.phone), note: contactNotes(c)}; }))); }, true], ['취소']]);
}
window.onContactsSaved = function(r){
  if(!r || r.denied){ toast('연락처 접근을 허용해야 저장할 수 있습니다'); return; }
  if(r.error){ toast('저장하지 못했습니다: ' + r.error); return; }
  const d = now().slice(0,10);
  // 웹판: 연락처를 읽을 수 없어 저장했는지 모른다 → 물어보고 표시 (같은 번호도 거르지 못함)
  if(r.web){ const todo = window._bulkTodo || [];
    ask(`연락처 화면에서 [모든 연락처 추가]를 눌렀나요?\n누르셨으면 ${todo.length}명에 📇 표시를 하고 다음 [모두 저장]에서 뺍니다.\n※ 웹판은 휴대폰 연락처를 볼 수 없어 이미 있는 번호를 거르지 못합니다. 겹친 연락처는 연락처 앱의 '중복 항목'에서 합치세요.`,
      [['추가했어요', ()=>{ todo.forEach(i=>{ if(customers[i]) customers[i].csaved = d; }); save('customers', customers); if(curRoute[0]==='month') drawMonth(curRoute[1], curRoute[2]); toast(`${todo.length}명에 📇 표시를 했습니다`); }, true], ['아직 안 했어요']]);
    return; }
  [...r.saved, ...r.dup.map(x=>x.i)].forEach(i=>{ if(customers[i]) customers[i].csaved = d; });
  save('customers', customers);
  if(curRoute[0]==='month') drawMonth(curRoute[1], curRoute[2]);
  const head = `새로 저장 ${r.saved.length}명 · 이미 있음 ${r.dup.length}명` + (r.fail.length?` · 실패 ${r.fail.length}명`:'');
  if(!r.dup.length && !r.fail.length){ ask(head, [['확인',null,true]]); return; }
  const li = (i, t) => customers[i] ? `<li onclick="closeModal();openDetail(${i})"><span class="nm">${esc(customers[i].name)}</span><span class="tail">${esc(t)}</span></li>` : '';
  askForm(head, (r.dup.length?`<p class="meta" style="margin:10px 0 4px">이미 있던 사람 (고객 이름 → 연락처에 저장된 이름, 누르면 고객 화면)</p>`:'') +
    `<ul class="names" style="max-height:45vh;overflow:auto;margin:0">${r.dup.map(x=>li(x.i, '→ '+x.name)).join('')}${r.fail.map(i=>li(i, '저장 실패')).join('')}</ul>`, [['확인',null,true]]);
};
function rowsHtml(rows){
  return rows.length ? rows.map(c=>`
    <li data-i="${c.i}" onclick="openDetail(${c.i})"><span class="nm">${esc(c.name)}${info(c)?`<span class="info"> / ${esc(info(c))}</span>`:''}</span>
      ${c.csaved?`<span class="st" title="연락처 저장">📇</span>`:''}${recMark(c)?`<span class="st">${recMark(c)}</span>`:''}
      ${c.sent?`<span class="sent">✓ ${esc(c.sent.slice(5,10).replace('-','/'))}</span>`:''}
      <span class="tail">${esc(c.phone.slice(-4))}</span></li>`).join('') : '<li class="empty">고객이 없습니다. 첫 화면의 [명단 불러오기]로 엑셀을 불러오세요.</li>';
}

// ---------- 고객 화면: 문자 미리보기 + [문자 보내기] ----------
// 고객에게 맞는 문구: 밸류업은 분류(쇼핑엔티 등)별 → 없으면 밸류업 기본
function keyFor(c){ const g = c.kind==='vu' ? groupOf(c) : ''; return g ? 'vu:'+g : c.kind; }
// 리쿠르팅 접수 문자 (2.0.5, 2026-10-13 지시): 고객 이름 앞 줄에 늘 '[보험설계사 채용 상담 접수 안내]' (약속 문자에는 붙이지 않음)
const RC_HEAD = '[보험설계사 채용 상담 접수 안내]';
const withRcHead = (key, s) => key==='rc' ? RC_HEAD + '\n' + s : s;
function letterFor(c){ return withRcHead(keyFor(c), composeText(keyFor(c), c.name)); }
function fmtPhone(p){ return p.length===11 ? p.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3') : p.length===10 ? p.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3') : p; }
function detail(i){
  const c = customers[i]; if(!c){ goBack(); return; }
  curRoute = ['detail', c.phone];
  setTitle(c.name);
  $v().innerHTML = `
    <div class="card"><h2>${esc(c.name)}<span class="tag ${c.kind}">${KINDS[c.kind]}</span></h2>
      <div class="meta">${esc(fmtPhone(c.phone))}${c.sent?' · 보낸 날: '+esc(c.sent):''}</div>
      ${info(c)?`<div class="meta">${esc(info(c))}</div>`:''}
      ${monthOf(c)||groupOf(c)?`<div class="meta">${esc([monthOf(c)?monthLabel(monthOf(c)):'', groupOf(c)].filter(Boolean).join(' · '))}</div>`:''}</div>
    <div class="card"><div class="meta" style="margin-bottom:8px">보낼 문자</div><div class="preview">${esc(letterFor(c))}</div></div>
    <div class="row"><button class="btn primary" onclick="sendTo(${i})">문자 보내기</button>
      <button class="btn primary call" onclick="callTo(${i})">전화 걸기</button></div>
    ${recordCard(i)}
    <button class="btn" style="width:100%;margin-top:10px;font-weight:700" onclick="saveContact(${i})">연락처 저장</button>
    <div class="meta" style="margin-top:6px;text-align:center">${esc(contactName(c))} · <a href="#" style="color:var(--link)" onclick="show(()=>contactFmtForm(${i}));return false">양식 ${contactFmt.mode==='manual'?'수동':'자동'} ›</a></div>
    <div class="row"><button class="btn" onclick="show(()=>editTpl(keyFor(customers[${i}])))">문자 문구 고치기</button>
      <button class="btn" onclick="removeCustomer(${i})">명단에서 빼기</button></div>
    <p class="note">[문자 보내기]를 누르면 문자 앱이 이 고객과 문자가 채워진 채로 열립니다. 문자 앱에서 보내기를 누르면 전송됩니다.<br>[전화 걸기]를 누르면 전화 앱에 번호가 입력된 채로 열립니다. 통화 버튼을 누르면 연결됩니다.<br>[연락처 저장]을 누르면 연락처 앱의 새 연락처 화면이 위 이름과 메모(유입월·구분)로 채워져 열립니다. 저장을 누르면 저장됩니다.</p>`;
}

// ---------- 기록: 부재중 · 통화완료 · 약속 (1.2.0, 2026-10-11 지시) ----------
// 기록은 연락처 번호별로 따로 둔다 (명단을 '새로 넣기'로 다시 불러와도 남게)
// 부재중: 1·2·3시간 뒤 또는 정한 시각에 '다시 전화' 휴대폰 알림 (고객마다 하나, 새로 걸면 바뀜. 통화완료를 적으면 꺼짐)
// 약속: 날짜·시간·장소 → [저장] [캘린더] [문자] 버튼을 따로 누른다 (1.16.0, 그 전엔 저장 → 캘린더 → 문자가 이어졌음)
let records = load('records', {});   // 번호 → [{type:'miss'|'call'|'appt', at:'yyyy-mm-dd hh:mm', remindAt:밀리초, off, memo, date:'yyyy-mm-dd', time:'hh:mm', place}]
const RN = {miss:'부재중', call:'통화완료', appt:'약속'}, RI = {miss:'📵', call:'✅', appt:'📅'};
const REC = Object.fromEntries(Object.keys(RN).map(k=>[k, RI[k]+' '+RN[k]]));
// 리쿠르팅 (2.0.3, 2026-10-13 지시): 약속 대신 CIS · TS. 기록은 약속(appt)과 같고 iv:'cis'|'ts'를 붙인다
// 문구의 {면접관} 자리: CIS = 부지점장님, TS = 본부장님. 리쿠르팅은 장소·링크를 쓰지 않는다
const IV = {cis:{label:'CIS', who:'부지점장님'}, ts:{label:'TS', who:'본부장님'}};
const recName = r => r.type==='appt' && IV[r.iv] ? IV[r.iv].label : RN[r.type] || '';
const recLabel = r => r.type==='appt' && IV[r.iv] ? RI.appt + ' ' + IV[r.iv].label : REC[r.type] || '';
const recsOf = c => records[c.phone] || [];
function addRec(c, r){ (records[c.phone] = records[c.phone] || []).push({at:now(), ...r}); save('records', records); }
const alarmId = c => parseInt(c.phone.slice(-9), 10) || 1;
const pendingRemind = c => recsOf(c).find(r=>r.type==='miss' && r.remindAt && !r.off && r.remindAt > Date.now());
const z2 = n => String(n).padStart(2,'0');
function whenLabel(ms){
  const d = new Date(ms), t = new Date(), day = 86400000;
  const k = Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - new Date(t.getFullYear(),t.getMonth(),t.getDate())) / day);
  return (k===0?'오늘':k===1?'내일':`${d.getMonth()+1}/${d.getDate()}`) + ` ${z2(d.getHours())}:${z2(d.getMinutes())}`;
}
const WEEK = '일월화수목금토';
function apptDate(s){ const d = new Date(s+'T00:00'); return isNaN(d) ? s : `${d.getMonth()+1}월 ${d.getDate()}일(${WEEK[d.getDay()]})`; }
function apptTime(s){ const m = String(s||'').match(/^(\d{1,2}):(\d{2})/); if(!m) return s||''; const h=+m[1], mi=+m[2];
  return `${h<12?'오전':'오후'} ${h%12||12}시${mi?` ${mi}분`:''}`; }
function recordCard(i){
  const c = customers[i], p = pendingRemind(c);
  const hist = recsOf(c).map((r,k)=>({...r,k})).reverse();
  return `<div class="card" style="margin-top:14px"><div class="meta" style="margin-bottom:8px">기록</div>
    <div class="rec3${c.kind==='rc' ? ' four' : ''}"><button class="btn miss" onclick="recMiss(${i})">부재중</button>
      <button class="btn done" onclick="recCall(${i})">통화완료</button>
      ${c.kind==='rc' ? `<button class="btn appt" onclick="show(()=>apptForm(${i},true,'cis'))">CIS</button>
      <button class="btn ts" onclick="show(()=>apptForm(${i},true,'ts'))">TS</button>`
      : `<button class="btn appt" onclick="show(()=>apptForm(${i},true))">약속</button>`}</div>
    ${p?`<div class="remind"><span>⏰ ${esc(whenLabel(p.remindAt))}에 다시 전화 알림</span><button onclick="offRemind(${i})">알림 끄기</button></div>`:''}
    ${hist.length?`<ul class="hist">${hist.map(r=>`<li><span class="when">${esc(r.at.slice(5).replace('-','/'))}</span>${recLabel(r)}
      ${r.type==='miss' && r.remindAt?`<span class="meta"> · ⏰ ${esc(whenLabel(r.remindAt))}${r.off?' (꺼짐)':''}</span>`:''}
      ${r.type==='appt'?`<span class="memo">${esc(apptDate(r.date))} ${esc(apptTime(r.time))}${r.place?' · '+esc(r.place):''}${r.link?'<br>🔗 '+esc(r.link):''}</span>`:''}
      ${r.memo?`<span class="memo">${esc(r.memo)}</span>`:''}
      <div class="acts">${r.type==='appt'?`<button onclick="apptCal(${i},${r.k})">캘린더</button><button onclick="apptSms(${i},${r.k})">약속 문자</button>`:''}
        <button class="x" onclick="delRec(${i},${r.k})">지우기</button></div></li>`).join('')}</ul>`
      :'<p class="note" style="margin:10px 0 0">아직 기록이 없습니다.</p>'}</div>`;
}
// 입력 칸이 있는 창 (부재중 시각 정하기·통화 메모)
function askForm(text, html, buttons){
  ask(text, buttons); const m = document.getElementById('mText');
  m.innerHTML = esc(text) + html; const f = m.querySelector('input,textarea'); if(f) setTimeout(()=>f.focus(), 50);
}
function recMiss(i){
  const h = n => () => missWith(i, Date.now() + n*3600000);
  ask('부재중으로 적습니다. 언제 다시 전화할지 알림을 걸까요?', [['1시간 뒤',h(1),true],['2시간 뒤',h(2),true],['3시간 뒤',h(3),true],
    ['시간 정하기',()=>pickTime(i)],['알림 없이 기록만',()=>missWith(i, 0)],['취소']]);
}
function localInput(ms){ const d = new Date(ms); return `${d.getFullYear()}-${z2(d.getMonth()+1)}-${z2(d.getDate())}T${z2(d.getHours())}:${z2(d.getMinutes())}`; }
function pickTime(i){
  askForm('알림 받을 날짜와 시각', `<input class="search" id="m_when" type="datetime-local" value="${localInput(Date.now()+3600000)}">`,
    [['알림 걸기',()=>{ const ms = new Date(document.getElementById('m_when').value).getTime();
        if(!(ms > Date.now())){ toast('지금보다 뒤의 시각을 골라 주세요'); setTimeout(()=>pickTime(i), 300); return; }
        missWith(i, ms); },true],['취소']]);
}
function missWith(i, ms){
  const c = customers[i];
  if(ms){
    recsOf(c).forEach(r=>{ if(r.remindAt) r.off = true; });   // 앞서 걸어 둔 알림은 새 것으로 바뀐다
    addRec(c, {type:'miss', remindAt:ms});
    const st = window.Android ? Android.setAlarm(alarmId(c), ms, `📞 다시 전화: ${c.name}`, [fmtPhone(c.phone), info(c)].filter(Boolean).join(' · '), c.phone) : 'ok';
    toast(`${whenLabel(ms)}에 알림이 옵니다` + (st==='ask' ? ' · 알림 [허용]을 눌러 주세요' : st==='cal' ? ' · 캘린더에서 [저장]을 눌러 주세요' : ''));   // cal = 웹판(캘린더 일정으로 알림)
  } else { addRec(c, {type:'miss'}); toast('부재중으로 적었습니다'); }
  detail(i);
}
window.onNotifyPerm = ok => { if(!ok) toast('알림이 꺼져 있어 다시 전화 알림이 오지 않습니다. 휴대폰 설정 > 앱 > 주피터 > 알림에서 켜 주세요'); };
function offRemind(i, quiet){
  const c = customers[i], p = pendingRemind(c); if(!p) return;
  p.off = true; save('records', records);
  if(window.Android) Android.cancelAlarm(alarmId(c));
  if(!quiet){ toast('알림을 껐습니다'); detail(i); }
}
function recCall(i){
  askForm('통화완료로 적습니다. 메모 (적지 않아도 됩니다)', `<textarea id="m_memo" placeholder="예: 다음 주 방문 원하심"></textarea>`,
    [['저장',()=>{ const c = customers[i], had = pendingRemind(c);
        addRec(c, {type:'call', memo:document.getElementById('m_memo').value.trim()});
        if(had) offRemind(i, true);
        toast('통화완료로 적었습니다' + (had ? ' · 다시 전화 알림은 껐습니다' : '')); detail(i); },true],['취소']]);
}
function delRec(i, k){
  const c = customers[i], r = recsOf(c)[k]; if(!r) return;
  ask(`${recName(r)} 기록(${r.at.slice(5).replace('-','/')})을 지울까요?`, [['지우기',()=>{
    if(r === pendingRemind(c)) offRemind(i, true);
    records[c.phone].splice(k, 1); save('records', records); detail(i); },true],['취소']]);
}

// 약속: 날짜 · 시간 · 장소 (+메모)
function apptForm(i, fresh, iv){
  const c = customers[i]; iv = IV[iv] ? iv : '';
  setTitle(c.name + ' ' + (iv ? IV[iv].label : '약속'));
  curRoute = ['appt', c.phone, iv];
  window._apptIv = iv;
  const t = new Date(Date.now()+86400000), tomorrow = `${t.getFullYear()}-${z2(t.getMonth()+1)}-${z2(t.getDate())}`;
  const hide = iv ? ' style="display:none"' : '';   // 리쿠르팅 CIS·TS는 장소·링크 칸 없음 (2.0.3)
  $v().innerHTML = `
    ${iv ? `<p class="note" style="margin-top:0">${IV[iv].label} · 면접관: ${IV[iv].who}</p>` : ''}
    <label>날짜</label><input class="search" id="a_date" type="date" value="${tomorrow}" oninput="apptPreview(${i})">
    <label>시간</label><input class="search" id="a_time" type="time" value="14:00" oninput="apptPreview(${i})">
    <div${hide}><label>장소명 <span class="meta" style="font-weight:400">(적지 않아도 됨)</span></label><input class="search" id="a_place" placeholder="예: 역삼역 스타벅스" oninput="apptPreview(${i})">
    <label>장소 링크 <span class="meta" style="font-weight:400">(지도·화상회의 주소, 적지 않아도 됨)</span></label><input class="search" id="a_link" type="url" inputmode="url" placeholder="예: https://naver.me/..." oninput="apptPreview(${i})"></div>
    <label>메모 <span class="meta" style="font-weight:400">(캘린더에만 들어감, 적지 않아도 됨)</span></label><input class="search" id="a_memo" placeholder="예: 보장분석 자료 준비">
    <label>보낼 약속 문자 <span class="meta" style="font-weight:400">(이 고객에게 맞게 바로 고쳐 쓰면 됨)</span></label>
    <textarea id="a_msg" style="min-height:150px" oninput="window._apptDirty=true"></textarea>
    <div class="count"><a href="#" style="color:var(--link)" onclick="window._apptDirty=false;apptPreview(${i});return false">${iv ? '날짜·시간대로' : '날짜·장소대로'} 다시 쓰기</a></div>
    <div class="rec3" style="margin-top:10px"><button class="btn appt" onclick="saveAppt(${i})">저장</button>
      <button class="btn done" id="a_cal" onclick="apptStep(${i},'cal')">캘린더</button>
      <button class="btn miss" id="a_sms" onclick="apptStep(${i},'sms')">문자</button></div>
    <p class="note">[저장]은 약속만 기록하고 고객 화면으로 돌아갑니다. [캘린더]는 구글 캘린더 새 일정을 엽니다. 구글에서 저장하고 주피터로 돌아오면 '내 이름/고객 이름/지역/AP'(리쿠르팅은 OT)를 복사해 두고 타임트리를 엽니다. 타임트리 새 일정 제목에 붙여 넣고 저장해 주세요. [문자]는 문자 앱을 엽니다.</p>`;
  window._apptDirty = false; window._apptK = -1;
  apptPreview(i);
  // 캘린더·문자에 다녀오는 사이 휴대폰이 앱을 정리해 이 화면이 다시 열리면, 적어 둔 약속을 그대로 채워 같은 기록을 이어 쓴다 (1.16.0)
  const d = load('apptDraft', null);
  if(fresh || !d || d.phone!==c.phone || (d.iv||'')!==iv || Date.now()-d.at > 3600000 || !(recsOf(c)[d.k]||{}).type){ try{ localStorage.removeItem('apptDraft'); }catch(e){} return; }
  [['a_date','date'],['a_time','time'],['a_place','place'],['a_link','link'],['a_memo','memo'],['a_msg','msg']].forEach(([id,f])=>{ document.getElementById(id).value = d[f]||''; });
  window._apptDirty = true; window._apptK = d.k;
}
// 장소명·링크 (1.3.1): 둘 다 적지 않아도 된다. 장소명이 없으면 문구의 '{장소}에서'를 통째로 뺀다.
// 링크는 문구에 {링크}가 있으면 그 자리에, 없으면 문자 맨 아래 '위치: 링크' 줄로 붙인다
function normLink(s){ s = String(s||'').trim(); return !s || /^[a-z][a-z0-9+.-]*:/i.test(s) ? s : 'https://' + s; }
// 약속 문자 (1.7.0): 그 고객 문구(이관 / 밸류업 분류별)의 약속 칸을 본문으로, 호칭·머리말·마무리는 그 문구 그대로
// 약속 칸이 없던 예전 저장분은 예전 '약속 문자' 문구의 본문(없으면 기본)을 쓴다
function apptBody(t){ return t.appt ?? (letters.tpl.appt && letters.tpl.appt.body) ?? DEFAULT_TPL.tr.appt; }
function apptText(c, r){ const t = tplOf(keyFor(c)); return apptFill(composeTpl({...t, body:apptBody(t)}, c.name), r); }
function apptFill(t, r){
  t = t.replace(/\{날짜\}/g, apptDate(r.date)).replace(/\{시간\}/g, apptTime(r.time));
  t = t.replace(/\{면접관\}/g, IV[r.iv] ? IV[r.iv].who : '');   // 2.0.3: CIS = 부지점장님, TS = 본부장님
  t = r.place ? t.replace(/\{장소\}/g, r.place) : t.replace(/\s*\{장소\}(에서|으로|로|에)?/g, '');
  if(/\{링크\}/.test(t)) t = t.replace(/\{링크\}/g, r.link || '');
  else if(r.link) t += '\n위치: ' + r.link;
  return t;
}
// 약속 문자 (1.6.0): [문자 문구]에서 따로 정하지 않고 약속 화면에서 고객마다 바로 고친다.
// 날짜·장소를 바꾸면 기본 문구로 다시 채우되, 손으로 고친 뒤에는 덮어쓰지 않는다 (_apptDirty)
function apptPreview(i){
  if(window._apptDirty) return;
  const g = id => document.getElementById(id).value.trim();
  document.getElementById('a_msg').value = apptText(customers[i], {date:g('a_date'), time:g('a_time'), place:g('a_place'), link:normLink(g('a_link')), iv:window._apptIv});
}
// 약속 버튼 나누기 (1.16.0, 2026-10-13 지시: '정보입력-캘린더-문자 자동 넘어가는데 버튼 쪼개줘')
// [저장] [캘린더] [문자]가 따로. 어느 버튼이든 먼저 약속을 기록하고, 같은 화면에서 또 누르면 같은 기록을 지금 칸 내용으로 고친다
function apptRec(i){
  const g = id => document.getElementById(id).value.trim(), c = customers[i];
  const r = {type:'appt', date:g('a_date'), time:g('a_time'), place:g('a_place'), link:normLink(g('a_link')), memo:g('a_memo'), msg:document.getElementById('a_msg').value};
  if(window._apptIv) r.iv = window._apptIv;
  if(!r.date || !r.time){ toast('날짜와 시간을 골라 주세요'); return -1; }
  const list = recsOf(c), k = window._apptK;
  if(k >= 0 && list[k] && list[k].type==='appt'){ list[k] = {...list[k], ...r}; save('records', records); }
  else { addRec(c, r); window._apptK = recsOf(c).length - 1; }
  save('apptDraft', {phone:c.phone, k:window._apptK, at:Date.now(), ...r});
  return window._apptK;
}
function saveAppt(i){
  if(apptRec(i) < 0) return;
  try{ localStorage.removeItem('apptDraft'); }catch(e){}
  toast((window._apptIv ? IV[window._apptIv].label + '를' : '약속을') + ' 기록했습니다');
  stack.pop(); show(stack[stack.length-1], false);   // 고객 화면으로
}
function apptStep(i, what){
  const k = apptRec(i); if(k < 0) return;
  const ok = what==='cal' ? apptCal(i, k) : apptSms(i, k);
  const b = document.getElementById(what==='cal' ? 'a_cal' : 'a_sms');
  if(ok && b) b.textContent = (what==='cal' ? '캘린더' : '문자') + ' ✓';
}
// 1.15.x 까지 캘린더에서 돌아오면 묻던 '약속 문자도 보낼까요?'는 없앰 (1.16.0) — 남아 있는 예전 표시만 지운다
function checkAfterCal(){ try{ localStorage.removeItem('afterCal'); }catch(e){} }
function apptCal(i, k){
  const c = customers[i], r = recsOf(c)[k]; if(!r) return false;
  const begin = new Date(`${r.date}T${r.time}`).getTime();
  // 캘린더: 위치 칸 = 장소명(없으면 링크), 설명 = 연락처 · 구분 · 링크 · 메모
  const desc = [fmtPhone(c.phone), [KINDS[c.kind], info(c)].filter(Boolean).join(' · '), r.link?'위치: '+r.link:'', r.memo].filter(Boolean).join('\n');
  const title = IV[r.iv] ? `${c.name} ${IV[r.iv].label} (${IV[r.iv].who})` : `${c.name} 고객 상담`;   // 2.0.3: 리쿠르팅은 'CIS (부지점장님)'
  // 2.0.11 타임트리에 붙여 넣을 글: 내 이름 / 고객 이름 / 지역(동) / AP — 빈 칸은 건너뜀. 2.0.12 리쿠르팅은 AP 대신 OT
  const tt = [me.name, c.name, c.region, c.kind==='rc' ? 'OT' : 'AP'].filter(Boolean).join('/');
  const ok = window.Android ? Android.openCalendar(title, begin, begin + 3600000, r.place || r.link || '', desc, tt) : false;
  if(!ok){ toast('캘린더를 열지 못했습니다'); return false; }
  if(window.webExtra) toast(`'${tt}' 복사됨 · 구글에서 저장하고 돌아오면 타임트리를 엽니다`);   // 웹판: 누를 때 복사 (web.js)
  else if(window.Android && Android.hasTimeTree && !Android.hasTimeTree()) toast('타임트리가 없어 구글 캘린더만 엽니다');
  else toast('구글에서 저장하고 돌아오면 타임트리가 열립니다');
  return true;
}
function apptSms(i, k){
  const c = customers[i], r = recsOf(c)[k]; if(!r) return;
  const text = r.msg || apptText(c, r);   // 약속 화면에서 고친 문자 (1.6.0 전 기록은 기본 문구로)
  const ok = window.Android ? Android.openSms(c.phone, text) : (toast(text), true);
  if(!ok) toast('문자 앱을 열지 못했습니다');
  return ok;
}
// 알림을 눌러 앱이 열리면 그 고객 화면으로
window.openByPhone = function(phone){
  const i = customers.findIndex(c=>c.phone===phone); if(i<0) return;
  closeModal(); stack.length = 0; stack.push(start, home); openDetail(i);
};

// 1.5.1: A~E는 '등급' 하나로 묶고, 등급을 고르면 옆에서 A~E를 고른다 (칸 값은 그대로 'A'~'E'로 저장)

function cfPart(k, c){

  window._hon = HONS.includes(h) ? h : '님';
  HONS.forEach(x=>document.getElementById('hon_'+x).classList.toggle('on', x===window._hon));
  tplPreview();
}
function tplPreview(){
  const t = readTpl(), s = withRcHead(window._tplKey, composeTpl(t, '김주성'));
  const d = new Date(Date.now()+86400000);
  const a = apptFill(composeTpl({...t, body:t.appt}, '김주성'), {date:`${d.getFullYear()}-${z2(d.getMonth()+1)}-${z2(d.getDate())}`, time:'14:00', place:window._tplKey==='rc' ? '' : '역삼역 스타벅스', link:'', iv:'cis'});
  document.getElementById('t_aprev').textContent = a;
  document.getElementById('t_acnt').textContent = a.length + '자' + (a.length>45 ? ' · 길어서 문자 앱이 장문(LMS)으로 보냅니다' : '');
  document.getElementById('t_prev').textContent = s;
  document.getElementById('t_cnt').textContent = s.length + '자' + (s.length>45 ? ' · 길어서 문자 앱이 장문(LMS)으로 보냅니다' : '');
}
function saveTpl(){ letters.tpl[window._tplKey] = readTpl(); save('letters', letters); toast('문자 문구를 저장했습니다'); goBack(); }
function resetTpl(){
  ask('이 분류의 문구를 지우고 밸류업 기본 문구를 쓸까요?', [['되돌리기',()=>{ delete letters.tpl[window._tplKey]; save('letters', letters); toast('기본 문구로 되돌렸습니다'); goBack(); },true],['취소']]);
}

// ---------- 명단 불러오기 (엑셀·CSV: 성격·이름·연락처) ----------
// ---------- 고객 직접 추가: 구분 · 월 · 분류 · 이름 · 생년 · 지역 · 연락처 ----------
function thisMonth(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function addForm(kind, month){
  curRoute = ['add', kind, month];
  setTitle('고객 추가');
  kind = kind || 'tr'; month = month || thisMonth();
  $v().innerHTML = `
    <label>구분</label>
    <div class="row" style="margin-top:0">
      <button class="btn seg" id="k_tr" onclick="pickKind('tr')">이관</button>
      <button class="btn seg" id="k_vu" onclick="pickKind('vu')">밸류업</button>
      <button class="btn seg" id="k_rc" onclick="pickKind('rc')">리쿠르팅</button></div>
    <label>월 (유입된 달)</label><input class="search" id="f_month" type="month" value="${esc(month)}">
    <label id="l_group">분류 <span class="meta" style="font-weight:400" id="l_group_note">(밸류업만: 있는 분류를 고르거나 새로 적기)</span></label>
    <div class="cschips hidden" id="rc_groups"></div>
    <input class="search" id="f_group" list="groups" placeholder="고르거나 적기" oninput="if(window._fKind==='rc') markRcGroup()"><datalist id="groups">${vuGroups().map(g=>`<option value="${esc(g.label)}">`).join('')}</datalist>
    <label>이름</label><input class="search" id="f_name" placeholder="김주성">
    <label>생년</label><input class="search" id="f_year" inputmode="numeric" maxlength="4" placeholder="1988 또는 88">
    <label>지역</label><input class="search" id="f_region" placeholder="역삼동 (주소 전체를 적어도 동·구·시로 줄여 저장)">
    <label>연락처</label><input class="search" id="f_phone" type="tel" inputmode="tel" placeholder="010-1234-5678">
    <button class="btn primary" style="width:100%;margin-top:16px" onclick="saveNew()">저장</button>`;
  pickKind(kind);
}
// 분류: 밸류업은 고르거나 적기, 리쿠르팅은 단추 + 직접 입력, 이관은 본사관심 / 해촉FC 단추만 (2.0.7)
function pickKind(k){
  const was = window._fKind;
  window._fKind = k; ['tr','vu','rc'].forEach(x=>document.getElementById('k_'+x).classList.toggle('on', x===k));
  const g = document.getElementById('f_group'), tr = k==='tr', rc = k==='rc', list = chipGroups(k);
  g.disabled = tr; if(was && was!==k) g.value = '';   // 이관은 단추로만 (칸은 고른 값만 보여 줌)
  g.placeholder = tr ? '위에서 고르기' : rc ? '직접 입력 (예: 지인소개)' : '고르거나 적기';
  if(list) g.removeAttribute('list'); else g.setAttribute('list', 'groups');   // 리쿠르팅·이관은 밸류업 분류 목록을 띄우지 않는다
  document.getElementById('l_group_note').textContent = rc ? '(리쿠 · DB · 상생 · 잡사 중 고르거나 직접 입력)' : tr ? '(본사관심 · 해촉FC 중 고르기)' : '(밸류업: 있는 분류를 고르거나 새로 적기)';
  const box = document.getElementById('rc_groups');
  box.innerHTML = list ? list.map(x=>`<button onclick="pickRcGroup('${x}')">${x}</button>`).join('') + (rc ? `<button onclick="pickRcGroup('')">직접 입력</button>` : '') : '';
  box.classList.toggle('hidden', !list);
  if(list && !list.includes(g.value) && (tr || !g.value)) pickRcGroup(list[0]); else markRcGroup();
}
// 분류 단추 (2.0.1 리쿠르팅, 2.0.7 이관): 누르면 칸에 그 이름이 들어가고, [직접 입력]은 칸을 비우고 적게 한다
function pickRcGroup(v){ const g = document.getElementById('f_group'); g.value = v; markRcGroup(); if(!v) g.focus(); }
function markRcGroup(){
  const v = document.getElementById('f_group').value.trim(), list = chipGroups(window._fKind) || [];
  document.querySelectorAll('#rc_groups button').forEach((b,i)=>b.classList.toggle('on', i<list.length ? b.textContent===v : !list.includes(v)));
}
function saveNew(){
  const val = id => document.getElementById(id).value.trim();
  const kind = window._fKind, name = val('f_name'), phone = normPhone(val('f_phone'));
  if(!name){ toast('이름을 적어 주세요'); return; }
  if(phone.length<10){ toast('연락처를 확인해 주세요'); return; }
  const r = val('f_region');
  const c = {kind, name, phone, month: normMonth(val('f_month')), group: val('f_group'), year: birthYear(val('f_year')), region: shortRegion(r) || r, sent:''};
  const put = i => { save('customers', customers); stack.pop(); show(()=>detail(i)); toast('고객을 저장했습니다'); };
  const old = customers.findIndex(x=>x.phone===phone);
  if(old>=0) ask(`같은 번호로 ${customers[old].name} 고객이 이미 있습니다. 새로 적은 내용으로 바꿀까요?`,
    [['바꾸기',()=>{ c.sent = customers[old].sent; customers[old] = c; put(old); },true],['취소']]);
  else { customers.push(c); put(customers.length-1); }
}

function importList(){
  if(!window.Android){ toast('휴대폰 앱에서만 불러올 수 있습니다'); return; }
  if(customers.length) ask('지금 명단에 더할까요, 지우고 새로 넣을까요?', [['더하기',()=>{ window._replace=false; Android.pickFile(); },true],['새로 넣기',()=>{ window._replace=true; Android.pickFile(); }],['취소']]);
  else { window._replace=false; Android.pickFile(); }
}
// 명단 양식 다운로드 (1.8.2): 앱은 저장 위치 고르는 창(MainActivity.saveForm), 웹은 파일 받기(web.js)
function downloadForm(){ if(window.Android && Android.saveForm) Android.saveForm(); else toast('휴대폰 앱에서만 받을 수 있습니다'); }
// 성격 칸의 '그룹1'~'그룹10' → 1~10 (아니면 0)
function groupNo(s){ const m = String(s||'').replace(/\s/g,'').match(/^그룹(\d{1,2})$/); const n = m ? +m[1] : 0; return n>=1 && n<=GROUP_MAX ? n : 0; }
function kindOf(s){ s=String(s||''); if(/이관/.test(s)) return 'tr'; if(/리쿠|리크루|recruit/i.test(s)) return 'rc'; if(/밸류|벨류|value|퍼미션/i.test(s)) return 'vu'; return ''; }
function normPhone(s){ let d=String(s||'').replace(/\D/g,''); if(d.startsWith('82')) d='0'+d.slice(2); if(d.length===10 && d.startsWith('10')) d='0'+d; return d; }
window.onImportError = e => toast('파일을 읽지 못했습니다: '+e);
window.onImported = function(rows){
  rows = (rows||[]).filter(r=>r && r.some(x=>String(x).trim()));
  if(!rows.length){ toast('파일에 내용이 없습니다'); return; }
  // 머리글 찾기: 성격/구분, 이름/고객명/성명, 연락처/휴대폰/전화/핸드폰 (없으면 앞 세 칸 순서대로)
  const h = rows[0].map(x=>String(x).replace(/\s/g,''));
  const find = re => h.findIndex(x=>re.test(x));
  // 분류(이관은 대상월, 밸류업은 캠페인) 칸은 있으면 쓴다: 분류/대상월/캠페인/그룹
  let ck=find(/성격|구분|종류/), cn=find(/이름|고객명|성명/), cp=find(/연락처|휴대폰|핸드폰|전화|번호/);
  if(ck<0) ck=find(/분류/);
  // 월(이관 대상월·밸류업 유입월)과 분류(밸류업 캠페인) 칸은 있으면 쓴다
  let cm=find(/^(월|유입월|대상월|배분월|월별|유입)$/);
  let cg=h.findIndex((x,i)=>i!==ck && i!==cm && /분류|캠페인/.test(x));   // 예전 명단의 분류 칸 (1.13.0부터는 성격 칸의 그룹1~10)
  let cy=find(/생년|출생|생일/), cr=find(/지역|주소|사는곳/);   // 있으면 쓴다
  let body = rows;
  if(cn>=0 && cp>=0) body = rows.slice(1); else { ck=0; cn=1; cp=2; cg=-1; cm=-1; cy=-1; cr=-1; }
  // 1.13.0 모양 엑셀(성격 그룹1~10 + 오른쪽 그룹 이름표)도 읽는다: 그룹 번호 대신 이름표의 이름(없으면 '그룹N')을 분류로
  const gmap = {};
  rows.forEach(r=>r.forEach((x,ci)=>{ if(ci===ck) return; const n = groupNo(x); if(n){ const nm = String(r[ci+1]||'').trim(); if(nm) gmap[n] = nm; } }));
  if(window._replace) customers = [];
  const byPhone = new Map(customers.map((c,i)=>[c.phone,i]));
  let added=0, updated=0, skipped=0;
  for(const r of body){
    const gno = groupNo(r[ck]), kind = gno ? 'vu' : kindOf(r[ck]), name = String(r[cn]||'').trim(), phone = normPhone(r[cp]);
    const group = gno ? (gmap[gno] || '그룹'+gno) : cg>=0 ? String(r[cg]||'').trim() : '', month = cm>=0 ? normMonth(r[cm]) : '';
    const year = cy>=0 ? birthYear(r[cy]) : '', region = cr>=0 ? shortRegion(r[cr]) : '';
    if(!name && phone.length<10) continue;   // 이름·번호가 다 빈 줄 (옆 표만 있는 줄)
    if(!kind || !name || phone.length<10){ skipped++; continue; }
    if(byPhone.has(phone)){ const c=customers[byPhone.get(phone)]; c.kind=kind; c.name=name; delete c.gno; if(cg>=0 || gno) c.group=group; if(month) c.month=month; if(year) c.year=year; if(region) c.region=region; updated++; }
    else { byPhone.set(phone, customers.length); customers.push({kind,name,phone,month,group,year,region,sent:''}); added++; }
  }
  save('customers', customers); lastImport = now(); save('lastImport', lastImport);
  stack.length=0; stack.push(start); show(home);
  toast(`새 고객 ${added}명 · 바뀐 고객 ${updated}명`+(skipped?` · 건너뛴 줄 ${skipped}`:''));
};

undoGroups();   // 1.13.0 그룹 번호로 옮겨 둔 문구·고객을 분류 이름으로 되돌림 (1.14.0)
// 2.2.1: 직접 완전히 끄고(최근 앱에서 밀어 끔) 다시 켜면 첫 화면. 다른 앱에 다녀오는 사이 휴대폰이 정리한 때만 보던 화면으로
if(window.Android && Android.isRestored && !Android.isRestored()) clearNav();
if(!restoreNav()) show(start);   // 휴대폰이 앱을 정리했다가 다시 열린 때는 보던 화면으로 (2.0.0: 첫 화면은 연락처 저장 / 고객관리)
adSync(); adPull('ba', true);   // 2.1.1 광고DB: 켤 때마다 15분 확인을 다시 걸고, 시트의 새 신청자를 저절로 저장
checkAfterCal();
</script>
